<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Group Chat — CA Study Board</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── CHAT LAYOUT ── */
.chat-wrapper {
  flex: 1; display: flex; flex-direction: column;
  max-width: 720px; margin: 0 auto; width: 100%;
  padding: 0 0 0; overflow: hidden;
}
.chat-header {
  padding: .75rem 1rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); flex-shrink: 0;
}
.chat-header-info strong { font-size: 15px; font-weight: 700; }
.chat-header-info p { font-size: 12px; color: var(--text2); }
.online-count { margin-left: auto; font-size: 12px; color: var(--text3); font-family: var(--mono); }

/* ── MESSAGES AREA ── */
.messages {
  flex: 1; overflow-y: auto; padding: 1rem;
  display: flex; flex-direction: column; gap: 6px;
}

/* ── MESSAGE BUBBLE ── */
.msg { display: flex; gap: 9px; animation: slideUp .2s ease; max-width: 75%; }
.msg.mine  { align-self: flex-end; flex-direction: row-reverse; }
.msg.other { align-self: flex-start; }
.msg.admin-msg .bubble { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.3); }

.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #fff; margin-top: 2px;
}
.msg.mine .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent-d)); color:#000; }
.msg.admin-msg .msg-avatar { background: linear-gradient(135deg, var(--accent), #e67e22); }

.bubble {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; padding: .55rem .9rem; max-width: 100%;
}
.msg.mine .bubble { background: var(--accent); border-color: var(--accent); color: #000; border-radius: 14px 14px 2px 14px; }
.msg.other .bubble { border-radius: 2px 14px 14px 14px; }

.bubble-name { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 2px; font-family: var(--mono); }
.msg.mine .bubble-name { display: none; }
.bubble-text { font-size: 14px; line-height: 1.5; word-break: break-word; }
.msg.mine .bubble-text { color: #000; }
.bubble-time { font-size: 10px; color: var(--text3); margin-top: 3px; font-family: var(--mono); text-align: right; }
.msg.mine .bubble-time { color: rgba(0,0,0,.5); }

/* ── DATE DIVIDER ── */
.date-divider {
  text-align: center; font-size: 11px; color: var(--text3);
  font-family: var(--mono); letter-spacing: .05em;
  display: flex; align-items: center; gap: 10px; margin: .5rem 0;
}
.date-divider::before, .date-divider::after {
  content:''; flex:1; height:1px; background:var(--border);
}

/* ── ADMIN PIN ── */
.pinned-msg {
  background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.2);
  border-radius: var(--radius); padding: .6rem 1rem; margin: 0 1rem .5rem;
  font-size: 12px; color: var(--text2); flex-shrink: 0;
  display: flex; align-items: center; gap: 7px;
}
.pinned-msg.hidden { display: none; }

/* ── COMPOSE ── */
.compose {
  padding: .75rem 1rem; border-top: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}
.compose-row { display: flex; gap: 8px; align-items: flex-end; }
.compose-row textarea {
  flex: 1; border-radius: 22px; padding: 10px 16px;
  min-height: 44px; max-height: 120px; resize: none; line-height: 1.5;
  font-size: 14px;
}
.send-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; transition: .15s;
}
.send-btn:hover { transform: scale(1.07); }
.send-btn:disabled { opacity: .4; pointer-events: none; }

/* ── EMPTY ── */
.empty-chat { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text3); flex-direction:column; gap:8px; }
.empty-chat .big { font-size:48px; }

@keyframes slideUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">CA <span>Board</span></a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">📋 Board</a>
    <a href="chat.html"  class="nav-link active">💬 Chat</a>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <div class="avatar" id="nav-avatar" style="width:30px;height:30px;font-size:13px">?</div>
    <button style="font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;font-family:var(--font)" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="chat-wrapper">
  <div class="chat-header">
    <div class="avatar" style="background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#000">📚</div>
    <div class="chat-header-info">
      <strong>Study Group Chat</strong>
      <p>Approved members only</p>
    </div>
    <span class="online-count" id="member-count">— members</span>
  </div>

  <div class="pinned-msg hidden" id="pinned-bar">
    📌 <span id="pinned-text"></span>
  </div>

  <div class="messages" id="messages"></div>

  <div class="compose">
    <div class="compose-row">
      <textarea id="msg-input" placeholder="Type a message..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="js/app.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
