<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chat — CA Study Board</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080e;--card:#0e0e1a;--card2:#13131f;--card3:#191926;
  --line2:#ffffff16;--line3:#ffffff22;
  --t1:#f4f4ff;--t2:#a0a0c8;--t3:#58587a;--t4:#30304a;
  --amber:#f59e0b;--amber2:#fbbf24;--green:#22c55e;--red:#f87171;
  --font:'Plus Jakarta Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;font-family:var(--font);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--t1);overflow:hidden}
body{display:flex;flex-direction:column}
.nav{height:56px;flex-shrink:0;display:flex;align-items:center;padding:0 1rem;border-bottom:1px solid var(--line2);background:rgba(8,8,14,.92);backdrop-filter:blur(16px);z-index:10;gap:8px}
.logo{font-size:16px;font-weight:800;letter-spacing:-.04em;text-decoration:none;color:var(--t1);display:flex;align-items:center;gap:7px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.logo span{color:var(--amber)}
.nav-links{display:flex;gap:3px;margin-left:auto}
.nl{font-size:13px;font-weight:600;color:var(--t3);padding:6px 11px;border-radius:8px;text-decoration:none;transition:.15s}
.nl:hover{color:var(--t1);background:var(--card2)}.nl.on{color:var(--t1);background:var(--card3);border:1px solid var(--line2)}
.nav-r{display:flex;align-items:center;gap:7px;margin-left:8px}
.av{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--amber),var(--amber2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#000;flex-shrink:0}
.logout-btn{font-size:12px;font-weight:600;color:var(--t3);background:none;border:1px solid var(--line2);padding:5px 10px;border-radius:8px;cursor:pointer;font-family:var(--font);transition:.15s}
.logout-btn:hover{color:var(--red);border-color:rgba(248,113,113,.3)}
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:700px;width:100%;margin:0 auto;overflow:hidden}
.chat-hdr{padding:.65rem 1rem;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;background:var(--card);flex-shrink:0}
.chat-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--amber),var(--amber2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.chat-hdr-info strong{font-size:14px;font-weight:700}.chat-hdr-info p{font-size:11px;color:var(--t3);margin-top:1px;font-weight:500}
.mcnt{margin-left:auto;font-size:11px;font-family:var(--mono);font-weight:500;color:var(--t3);background:var(--card2);border:1px solid var(--line2);padding:4px 10px;border-radius:20px}
.messages{flex:1;overflow-y:auto;padding:.9rem 1rem;display:flex;flex-direction:column;gap:4px}
.messages::-webkit-scrollbar{width:4px}.messages::-webkit-scrollbar-track{background:transparent}.messages::-webkit-scrollbar-thumb{background:var(--line3);border-radius:4px}
.date-div{display:flex;align-items:center;gap:10px;font-size:10px;font-family:var(--mono);font-weight:500;color:var(--t4);letter-spacing:.06em;margin:.5rem 0}
.date-div::before,.date-div::after{content:'';flex:1;height:1px;background:var(--line2)}
.msg{display:flex;gap:7px;max-width:80%;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.them{align-self:flex-start}
.msg-av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.msg.me .msg-av{background:linear-gradient(135deg,var(--amber),var(--amber2));color:#000}
.msg.adm-msg .msg-av{background:linear-gradient(135deg,var(--amber),#e67e22)}
.bubble{border-radius:14px;padding:.5rem .85rem;max-width:100%;word-break:break-word}
.msg.them .bubble{background:var(--card2);border:1px solid var(--line2);border-radius:3px 14px 14px 14px}
.msg.me .bubble{background:linear-gradient(135deg,var(--amber),var(--amber2));border-radius:14px 14px 3px 14px}
.msg.adm-msg.them .bubble{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:3px 14px 14px 14px}
.bname{font-size:10px;font-weight:700;font-family:var(--mono);color:var(--amber);margin-bottom:3px}
.msg.me .bname{display:none}
.btext{font-size:14px;font-weight:500;line-height:1.5;color:var(--t1)}
.msg.me .btext{color:#000}
.btime{font-size:10px;font-family:var(--mono);color:var(--t4);margin-top:2px;text-align:right}
.msg.me .btime{color:rgba(0,0,0,.4)}
.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--t4)}
.empty-chat .big{font-size:44px;filter:grayscale(1);opacity:.3}
.empty-chat p{font-size:14px;font-weight:600;color:var(--t3)}
.compose{padding:.65rem 1rem;border-top:1px solid var(--line2);background:var(--card);flex-shrink:0}
.compose-row{display:flex;gap:8px;align-items:flex-end}
.compose-row textarea{flex:1;background:var(--card2);border:1.5px solid var(--line2);color:var(--t1);border-radius:14px;padding:11px 16px;font-family:var(--font);font-size:14px;font-weight:500;outline:none;resize:none;min-height:44px;max-height:110px;line-height:1.5;transition:.2s}
.compose-row textarea:focus{border-color:var(--amber)}
.compose-row textarea::placeholder{color:var(--t4)}
.send-btn{width:44px;height:44px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--amber),var(--amber2));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#000;font-weight:800;transition:.18s;box-shadow:0 4px 16px rgba(245,158,11,.3)}
.send-btn:hover{transform:scale(1.06)}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--card3);border:1px solid var(--line3);color:var(--t1);padding:11px 22px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;pointer-events:none;opacity:0;transition:.25s;white-space:nowrap;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#toast.on{opacity:1}
</style>
</head>
<body>
<nav class="nav">
  <a class="logo" href="index.html"><span class="logo-dot"></span>CA <span>Board</span></a>
  <div class="nav-links">
    <a href="index.html" class="nl">📋 Board</a>
    <a href="chat.html"  class="nl on">💬 Chat</a>
  </div>
  <div class="nav-r">
    <div class="av" id="nav-av">?</div>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
</nav>
<div class="chat-wrap">
  <div class="chat-hdr">
    <div class="chat-icon">📚</div>
    <div class="chat-hdr-info"><strong>Study Group Chat</strong><p>Approved members only</p></div>
    <span class="mcnt" id="mcnt">—</span>
  </div>
  <div class="messages" id="msgs"></div>
  <div class="compose">
    <div class="compose-row">
      <textarea id="inp" placeholder="Write a message…" rows="1" onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
const K={MSGS:'cab_msgs',USERS:'cab_users',NAME:'cab_name'};
function sg(k,d){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d}catch{return d}}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
// ✅ FIX 3: persistent login
function getS(){try{return JSON.parse(localStorage.getItem('cab_s'))||null}catch{return null}}
function clearS(){localStorage.removeItem('cab_s')}
function isAdmin(){return getS()?.role==='admin'}
function cPhone(){return getS()?.phone||null}
function getUsers(){return sg(K.USERS,[])}
function findUser(p){return getUsers().find(u=>u.phone===p)||null}
function cName(){if(isAdmin())return sg(K.NAME,'Admin');return findUser(cPhone())?.name||'Member'}
function getMsgs(){return sg(K.MSGS,[])}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
let lastCount=0;
window.addEventListener('load',()=>{
  const s=getS();
  if(!s){location.href='register.html';return}
  if(s.role==='member'){const u=findUser(s.phone);if(!u||!u.approved){location.href='register.html';return}}
  document.getElementById('nav-av').textContent=cName()[0].toUpperCase();
  document.getElementById('mcnt').textContent=getUsers().filter(u=>u.approved).length+' members';
  render();scrollBot(false);
  setInterval(poll,2500);
});
function poll(){const m=getMsgs();if(m.length!==lastCount){const near=isNear();render();if(near)scrollBot(true)}}
function render(){
  const msgs=getMsgs();lastCount=msgs.length;const me=cPhone();const c=document.getElementById('msgs');
  if(!msgs.length){c.innerHTML=`<div class="empty-chat"><div class="big">💬</div><p>No messages yet. Say hi!</p></div>`;return}
  let html='',lastDate='';
  msgs.forEach(m=>{
    const d=new Date(m.ts);
    const ds=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
    if(ds!==lastDate){html+=`<div class="date-div">${ds}</div>`;lastDate=ds}
    const isMine=m.phone===me,isAdm=m.role==='admin';
    const ts=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    html+=`<div class="msg ${isMine?'me':'them'} ${isAdm?'adm-msg':''}">
      <div class="msg-av">${(m.name||'?')[0].toUpperCase()}</div>
      <div class="bubble">
        ${!isMine?`<div class="bname">${esc(m.name)}${isAdm?' 👑':''}</div>`:''}
        <div class="btext">${esc(m.text)}</div>
        <div class="btime">${ts}</div>
      </div></div>`;
  });
  c.innerHTML=html;
}
function sendMsg(){
  const inp=document.getElementById('inp');const text=inp.value.trim();if(!text)return;
  const msgs=getMsgs();
  msgs.push({id:Date.now(),phone:cPhone()||'admin',name:cName(),role:isAdmin()?'admin':'member',text,ts:Date.now()});
  if(msgs.length>300)msgs.splice(0,msgs.length-300);
  ss(K.MSGS,msgs);inp.value='';resize(inp);render();scrollBot(true);
}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}}
function resize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px'}
function isNear(){const m=document.getElementById('msgs');return m.scrollHeight-m.scrollTop-m.clientHeight<100}
function scrollBot(s){const m=document.getElementById('msgs');m.scrollTo({top:m.scrollHeight,behavior:s?'smooth':'instant'})}
function doLogout(){clearS();location.href='register.html'}
</script>
</body>
</html>
