<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chat — CA Study Board</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--s1:#111118;--s2:#18181f;--s3:#1e1e28;
  --b1:#2a2a38;--b2:#3a3a50;
  --t1:#f0f0ff;--t2:#9090b0;--t3:#55556a;
  --acc:#f5a623;--acc2:#e0911a;
  --grn:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a78bfa;
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'Syne',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column}

nav{height:56px;flex-shrink:0;display:flex;align-items:center;padding:0 1rem;border-bottom:1px solid var(--b1);background:rgba(10,10,15,.95);backdrop-filter:blur(10px);z-index:10;gap:10px}
.nav-logo{font-size:16px;font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--t1)}
.nav-logo span{color:var(--acc)}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nl{font-size:13px;font-weight:600;color:var(--t2);padding:6px 12px;border-radius:8px;text-decoration:none;transition:.15s}
.nl:hover{color:var(--t1);background:var(--s2)}.nl.on{color:var(--t1);background:var(--s3)}
.nav-r{display:flex;align-items:center;gap:8px;margin-left:10px}
.nav-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#000}
.nav-logout{font-size:12px;color:var(--t3);background:none;border:none;cursor:pointer;font-family:'Syne',sans-serif;padding:5px 8px;border-radius:6px;transition:.15s}
.nav-logout:hover{color:var(--red)}

.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:700px;width:100%;margin:0 auto;overflow:hidden}

.chat-hdr{padding:.65rem 1rem;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;background:var(--s1);flex-shrink:0}
.chat-icon{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.chat-hdr-info strong{font-size:14px;font-weight:700}
.chat-hdr-info p{font-size:11px;color:var(--t2)}
.member-cnt{margin-left:auto;font-size:11px;color:var(--t3);font-family:'DM Mono',monospace}

.messages{flex:1;overflow-y:auto;padding:.9rem 1rem;display:flex;flex-direction:column;gap:5px}
.messages::-webkit-scrollbar{width:4px}.messages::-webkit-scrollbar-track{background:transparent}.messages::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px}

.date-div{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--t3);font-family:'DM Mono',monospace;letter-spacing:.05em;margin:.4rem 0}
.date-div::before,.date-div::after{content:'';flex:1;height:1px;background:var(--b1)}

.msg{display:flex;gap:8px;max-width:78%;animation:up .2s ease}
@keyframes up{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.them{align-self:flex-start}
.msg-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;margin-top:2px;background:linear-gradient(135deg,var(--blue),var(--purple))}
.msg.me .msg-av{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#000}
.msg.adm-msg .msg-av{background:linear-gradient(135deg,var(--acc),#e67e22)}
.bubble{border-radius:14px;padding:.5rem .85rem;max-width:100%}
.msg.them .bubble{background:var(--s2);border:1px solid var(--b1);border-radius:3px 14px 14px 14px}
.msg.me .bubble{background:var(--acc);border-radius:14px 14px 3px 14px}
.msg.adm-msg .bubble{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);border-radius:3px 14px 14px 14px}
.bname{font-size:10px;font-weight:700;color:var(--acc);margin-bottom:2px;font-family:'DM Mono',monospace}
.msg.me .bname{display:none}
.btext{font-size:13px;line-height:1.5;word-break:break-word;color:var(--t1)}
.msg.me .btext{color:#000}
.btime{font-size:10px;color:var(--t3);margin-top:2px;text-align:right;font-family:'DM Mono',monospace}
.msg.me .btime{color:rgba(0,0,0,.45)}

.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--t3)}
.empty-chat .big{font-size:44px}

.compose{padding:.65rem 1rem;border-top:1px solid var(--b1);background:var(--s1);flex-shrink:0}
.compose-row{display:flex;gap:8px;align-items:flex-end}
.compose-row textarea{flex:1;background:var(--s2);border:1.5px solid var(--b1);color:var(--t1);border-radius:22px;padding:10px 16px;font-family:'Syne',sans-serif;font-size:14px;outline:none;resize:none;min-height:42px;max-height:110px;line-height:1.5;transition:.2s}
.compose-row textarea:focus{border-color:var(--acc)}
.compose-row textarea::placeholder{color:var(--t3)}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--acc);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:.15s}
.send-btn:hover{transform:scale(1.07)}

#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--s3);border:1px solid var(--b2);color:var(--t1);padding:10px 20px;border-radius:30px;font-size:13px;z-index:999;pointer-events:none;opacity:0;transition:.25s;white-space:nowrap;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">CA <span>Board</span></a>
  <div class="nav-links">
    <a href="index.html" class="nl">📋 Board</a>
    <a href="chat.html"  class="nl on">💬 Chat</a>
  </div>
  <div class="nav-r">
    <div class="nav-av" id="nav-av">?</div>
    <button class="nav-logout" onclick="doLogout()">Logout</button>
  </div>
</nav>

<div class="chat-wrap">
  <div class="chat-hdr">
    <div class="chat-icon">📚</div>
    <div class="chat-hdr-info"><strong>Study Group Chat</strong><p>Approved members only</p></div>
    <span class="member-cnt" id="mcnt">— members</span>
  </div>
  <div class="messages" id="msgs"></div>
  <div class="compose">
    <div class="compose-row">
      <textarea id="inp" placeholder="Type a message..." rows="1" onkeydown="onKey(event)" oninput="resize(this)"></textarea>
      <button class="send-btn" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const K={MSGS:'cab_msgs',USERS:'cab_users',NAME:'cab_name'};
function sg(k,d=[]){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
function getSession(){try{return JSON.parse(sessionStorage.getItem('cab_s'))||null}catch{return null}}
function clearSession(){sessionStorage.removeItem('cab_s')}
function isAdmin(){return getSession()?.role==='admin'}
function isMember(){return getSession()?.role==='member'}
function currentPhone(){return getSession()?.phone||null}
function getUsers(){return sg(K.USERS,[])}
function findUser(ph){return getUsers().find(u=>u.phone===ph)||null}
function currentName(){if(isAdmin())return sg(K.NAME,'Admin');return findUser(currentPhone())?.name||'Member'}
function getMessages(){return sg(K.MSGS,[])}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2800)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

let lastCount=0;

window.addEventListener('load',()=>{
  if(!isAdmin()&&!isMember()){location.href='register.html';return}
  if(!isAdmin()){const u=findUser(currentPhone());if(!u||!u.approved){location.href='register.html';return}}
  const n=currentName();document.getElementById('nav-av').textContent=n[0].toUpperCase();
  document.getElementById('mcnt').textContent=getUsers().filter(u=>u.approved).length+' members';
  render();scrollBottom(false);
  setInterval(poll,2500);
});

function poll(){const msgs=getMessages();if(msgs.length!==lastCount){const near=isNear();render();if(near)scrollBottom(true)}}

function render(){
  const msgs=getMessages();lastCount=msgs.length;
  const me=currentPhone();const c=document.getElementById('msgs');
  if(!msgs.length){c.innerHTML=`<div class="empty-chat"><div class="big">💬</div><p>No messages yet. Say hi!</p></div>`;return}
  let html='';let lastDate='';
  msgs.forEach(m=>{
    const d=new Date(m.ts);
    const ds=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
    if(ds!==lastDate){html+=`<div class="date-div">${ds}</div>`;lastDate=ds}
    const isMine=m.phone===me;const isAdm=m.role==='admin';
    const ts=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
    const init=(m.name||'?')[0].toUpperCase();
    html+=`<div class="msg ${isMine?'me':'them'} ${isAdm?'adm-msg':''}">
      <div class="msg-av">${init}</div>
      <div class="bubble">
        ${!isMine?`<div class="bname">${esc(m.name)}${isAdm?' 👑':''}</div>`:''}
        <div class="btext">${esc(m.text)}</div>
        <div class="btime">${ts}</div>
      </div></div>`;
  });
  c.innerHTML=html;
}

function sendMsg(){
  const inp=document.getElementById('inp');const text=inp.value.trim();if(!text)return;
  const msgs=getMessages();
  msgs.push({id:Date.now(),phone:currentPhone()||'admin',name:currentName(),role:isAdmin()?'admin':'member',text,ts:Date.now()});
  if(msgs.length>300)msgs.splice(0,msgs.length-300);
  ss(K.MSGS,msgs);inp.value='';resize(inp);render();scrollBottom(true);
}

function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}}
function resize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px'}
function isNear(){const m=document.getElementById('msgs');return m.scrollHeight-m.scrollTop-m.clientHeight<80}
function scrollBottom(smooth){const m=document.getElementById('msgs');m.scrollTo({top:m.scrollHeight,behavior:smooth?'smooth':'instant'})}
function doLogout(){clearSession();location.href='register.html'}
</script>
</body>
</html>
