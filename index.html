<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TBC Bot Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0f;color:#fff;font-family:Arial,sans-serif}
main{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:24px;margin:0}.pill{padding:7px 11px;border-radius:99px;background:#20232b;color:#aaa;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:#14161d;border:1px solid #272a34;border-radius:16px;padding:16px;margin-top:12px}
.label{color:#969baa;font-size:12px}.num{font-size:24px;font-weight:800;margin-top:7px}
h2{font-size:17px;margin:24px 0 8px}.row{display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid #272a34}
.row:last-child{border:0}.k{color:#969baa}.v{text-align:right;word-break:break-word}
.good{color:#51e890}.bad{color:#ff6470}.err{display:none;background:#35161b;color:#ff8991;padding:12px;border-radius:12px;margin:12px 0}
button{width:100%;margin-top:15px;padding:13px;border:0;border-radius:12px;font-weight:800}
small{color:#858b9a}
</style>
</head>
<body>
<main>
<div class="top"><h1>🤖 Bot Dashboard</h1><span id="status" class="pill">Loading</span></div>
<div id="err" class="err"></div>

<div class="grid">
<div class="card"><div class="label">Bot ID</div><div id="botid" class="num">—</div></div>
<div class="card"><div class="label">Users</div><div id="users" class="num">—</div></div>
<div class="card"><div class="label">Bot Status</div><div id="botstatus" class="num">—</div></div>
<div class="card"><div class="label">Data Entries</div><div id="entries" class="num">—</div></div>
</div>

<h2>⚙️ Bot Information</h2><div id="info" class="card">Loading...</div>
<h2>📦 Exported TBC Data</h2><div id="data" class="card">Loading...</div>

<button onclick="load()">🔄 Refresh</button>
</main>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

function esc(x){return String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function primitive(v){
 if(v===null||v===undefined)return "—";
 if(typeof v==="object")return JSON.stringify(v);
 return esc(v);
}
function rows(obj,limit=150){
 if(!obj||typeof obj!=="object")return `<div>${primitive(obj)}</div>`;
 return Object.entries(obj).slice(0,limit).map(([k,v])=>
 `<div class="row"><span class="k">${esc(k)}</span><span class="v">${primitive(v)}</span></div>`
 ).join("");
}
async function load(){
 const status=document.getElementById("status"),err=document.getElementById("err");
 err.style.display="none";status.textContent="Loading...";
 try{
   const qs=new URLSearchParams(location.search);
   const botId=qs.get("bot_id")||qs.get("botid");
   if(!botId)throw new Error("Missing bot_id. Open the Mini App as ?bot_id=4446654");

   let url="/api/bot?bot_id="+encodeURIComponent(botId);
   if(tg?.initData)url+="&initData="+encodeURIComponent(tg.initData);

   const r=await fetch(url,{headers:{Accept:"application/json"}});
   const d=await r.json();
   if(!r.ok||d.error)throw new Error(d.error||("HTTP "+r.status));

   document.getElementById("botid").textContent=d.bot_id||botId;
   document.getElementById("users").textContent=
      d.user_count!==undefined?Number(d.user_count).toLocaleString():"—";
   document.getElementById("botstatus").innerHTML=
      d.status?primitive(d.status):"—";

   const info={};
   for(const k of ["username","first_name","status","owner_email","account_points","bot_id"]){
      if(d.bot_info&&d.bot_info[k]!==undefined)info[k]=d.bot_info[k];
   }
   document.getElementById("info").innerHTML=rows(info);

   const payload=d.export_data||d;
   document.getElementById("data").innerHTML=rows(payload);
   document.getElementById("entries").textContent=
      payload&&typeof payload==="object"?Object.keys(payload).length:"—";

   status.textContent="● Live";
   status.style.color="#51e890";
 }catch(e){
   status.textContent="Error";
   err.style.display="block";
   err.textContent="❌ "+e.message;
 }
}
load();
setInterval(load,30000);
</script>
</body>
</html>
