<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Bot Dashboard</title>

    <!-- Telegram Mini App SDK MUST load first -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #171717;
        }

        .header {
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            color: white;
            padding: 25px 18px;
            border-radius: 0 0 25px 25px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            margin-top: 7px;
            opacity: .85;
            font-size: 14px;
        }

        .container {
            padding: 18px;
        }

        .bot-card {
            background: white;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .row:last-child {
            border-bottom: 0;
        }

        .label {
            color: #777;
        }

        .value {
            font-weight: bold;
            text-align: right;
            word-break: break-word;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #dff8e8;
            color: #159447;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 50px 10px;
        }

        .error {
            display: none;
            background: #ffe5e5;
            color: #d63031;
            padding: 15px;
            border-radius: 15px;
        }

        .user {
            background: white;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 15px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1 id="title">Bot Dashboard</h1>
    <p id="subtitle">Detecting bot...</p>
</div>

<div class="container">

    <div id="loading" class="loading">
        ⏳ Loading...
    </div>

    <div id="error" class="error"></div>

    <div id="content" style="display:none;">

        <div class="user">
            <div class="title">👤 Telegram User</div>

            <div class="row">
                <span class="label">Name</span>
                <span class="value" id="userName">-</span>
            </div>

            <div class="row">
                <span class="label">Username</span>
                <span class="value" id="userUsername">-</span>
            </div>

            <div class="row">
                <span class="label">User ID</span>
                <span class="value" id="userId">-</span>
            </div>
        </div>

        <div class="bot-card">

            <div class="title">🤖 Bot Information</div>

            <div class="row">
                <span class="label">Bot Username</span>
                <span class="value" id="botUsername">-</span>
            </div>

            <div class="row">
                <span class="label">Bot ID</span>
                <span class="value" id="botId">-</span>
            </div>

            <div class="row">
                <span class="label">Status</span>
                <span class="status">Online</span>
            </div>

        </div>

    </div>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


// ================================
// GET TELEGRAM MINI APP DATA
// ================================

const initData = tg.initData;
const tgData = tg.initDataUnsafe || {};

const user = tgData.user || {};


// ================================
// SHOW USER DATA
// ================================

document.getElementById("userName").textContent =
    user.first_name ||
    "Unknown";

document.getElementById("userUsername").textContent =
    user.username
        ? "@" + user.username
        : "No username";

document.getElementById("userId").textContent =
    user.id ||
    "Unknown";


// ================================
// TRY TO DETECT BOT
// ================================

/*
 Telegram WebApp normally does NOT expose
 the bot ID directly.

 If your Mini App URL contains:

 https://example.com/?bot=MyBot

 it will automatically read it.
*/

const params =
    new URLSearchParams(window.location.search);

let botUsername =
    params.get("bot") ||
    params.get("bot_username") ||
    "";


// ================================
// BOT USERNAME
// ================================

if (botUsername) {

    if (botUsername.startsWith("@")) {
        botUsername =
            botUsername.substring(1);
    }

    document.getElementById("botUsername")
        .textContent =
        "@" + botUsername;

    document.getElementById("title")
        .textContent =
        "@" + botUsername;

    document.getElementById("subtitle")
        .textContent =
        "Telegram Bot Dashboard";

} else {

    document.getElementById("subtitle")
        .textContent =
        "Bot username was not provided";

}


// ================================
// SHOW PAGE
// ================================

document.getElementById("loading")
    .style.display = "none";

document.getElementById("content")
    .style.display = "block";


// ================================
// DEBUG
// ================================

console.log("Telegram WebApp:", tg);
console.log("Init Data:", initData);
console.log("Telegram User:", user);
console.log("Bot Username:", botUsername);

</script>

</body>
</html>
