<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Bot Dashboard</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #171717;
        }

        .header {
            background: linear-gradient(135deg, #6c5ce7, #4834d4);
            color: white;
            padding: 25px 18px;
            border-radius: 0 0 25px 25px;
        }

        .header h1 {
            font-size: 24px;
        }

        .header p {
            margin-top: 7px;
            opacity: .85;
        }

        .container {
            padding: 18px;
        }

        .loading {
            text-align: center;
            padding: 50px 10px;
        }

        .error {
            display: none;
            background: #ffe5e5;
            color: #d63031;
            padding: 15px;
            border-radius: 15px;
        }

        .content {
            display: none;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .row:last-child {
            border-bottom: 0;
        }

        .label {
            color: #777;
        }

        .value {
            font-weight: bold;
            text-align: right;
            word-break: break-word;
        }

        .number-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat {
            background: white;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        .stat-title {
            color: #777;
            font-size: 13px;
        }

        .stat-value {
            font-size: 23px;
            font-weight: bold;
            margin-top: 7px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1 id="botName">Bot Dashboard</h1>
    <p id="botSubtitle">Loading bot data...</p>
</div>

<div class="container">

    <div id="loading" class="loading">
        ⏳ Fetching bot data...
    </div>

    <div id="error" class="error"></div>

    <div id="content" class="content">

        <div class="number-grid">

            <div class="stat">
                <div class="stat-title">👥 Users</div>
                <div class="stat-value" id="users">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">💰 Balance</div>
                <div class="stat-value" id="balance">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">👨‍💼 Admins</div>
                <div class="stat-value" id="admins">0</div>
            </div>

            <div class="stat">
                <div class="stat-title">📊 Transactions</div>
                <div class="stat-value" id="transactions">0</div>
            </div>

        </div>

        <br>

        <div class="card">

            <div class="title">🤖 Bot Information</div>

            <div class="row">
                <span class="label">Bot Name</span>
                <span class="value" id="bot_name">-</span>
            </div>

            <div class="row">
                <span class="label">Username</span>
                <span class="value" id="bot_username">-</span>
            </div>

            <div class="row">
                <span class="label">Bot ID</span>
                <span class="value" id="bot_id">-</span>
            </div>

        </div>

        <div class="card">

            <div class="title">⚙️ Settings</div>

            <div class="row">
                <span class="label">Daily Bonus</span>
                <span class="value" id="daily_bonus">-</span>
            </div>

            <div class="row">
                <span class="label">Referral Bonus</span>
                <span class="value" id="refer_bonus">-</span>
            </div>

            <div class="row">
                <span class="label">Minimum Withdrawal</span>
                <span class="value" id="min_withdraw">-</span>
            </div>

        </div>

    </div>
</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


// ======================================
// TBC BACKEND
// ======================================
//
// IMPORTANT:
//
// This must be a REAL HTTP endpoint.
//
// "/mini_app_data" is NOT a TBC command URL.
//
// Your TBC command must expose an HTTP/API
// endpoint that this page can access.
//
// ======================================

const API_URL = "YOUR_TBC_API_ENDPOINT";


async function loadData() {

    const loading =
        document.getElementById("loading");

    const content =
        document.getElementById("content");

    const error =
        document.getElementById("error");

    try {

        /*
         * Telegram automatically gives us
         * the Mini App initialization data.
         */

        const initData = tg.initData;

        if (!initData) {
            throw new Error(
                "Mini App must be opened inside Telegram."
            );
        }


        /*
         * Send Telegram session data
         * to your TBC backend.
         */

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                action: "init",

                init_data: initData

            })

        });


        if (!response.ok) {

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!data.ok) {

            throw new Error(
                data.error ||
                "Unable to fetch bot data"
            );

        }


        // ==================================
        // BOT
        // ==================================

        const bot =
            data.bot || {};

        document.getElementById("botName")
            .textContent =
            bot.name || "Bot Dashboard";

        document.getElementById("botSubtitle")
            .textContent =
            bot.username
                ? "@" + bot.username
                : "Telegram Bot";

        document.getElementById("bot_name")
            .textContent =
            bot.name || "-";

        document.getElementById("bot_username")
            .textContent =
            bot.username
                ? "@" + bot.username
                : "-";

        document.getElementById("bot_id")
            .textContent =
            bot.id || "-";


        // ==================================
        // STATS
        // ==================================

        const stats =
            data.stats || {};

        document.getElementById("users")
            .textContent =
            stats.total_users ?? 0;

        document.getElementById("balance")
            .textContent =
            stats.total_balance ?? 0;

        document.getElementById("admins")
            .textContent =
            stats.total_admins ?? 0;

        document.getElementById("transactions")
            .textContent =
            stats.total_transactions ?? 0;


        // ==================================
        // SETTINGS
        // ==================================

        const settings =
            data.settings || {};

        document.getElementById("daily_bonus")
            .textContent =
            settings.daily_bonus ?? "-";

        document.getElementById("refer_bonus")
            .textContent =
            settings.refer_bonus ?? "-";

        document.getElementById("min_withdraw")
            .textContent =
            settings.min_withdraw ?? "-";


        // ==================================
        // SHOW
        // ==================================

        loading.style.display = "none";

        content.style.display = "block";

    }

    catch (e) {

        console.error(e);

        loading.style.display = "none";

        error.style.display = "block";

        error.textContent =
            "❌ " + e.message;

    }

}


loadData();

</script>

</body>
    </html>
