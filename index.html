<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet Bot Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💰 Wallet Bot</h1>
            <button class="refresh-btn" onclick="refreshData()">🔄</button>
        </div>

        <!-- User Profile Card -->
        <div class="card user-card">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-info">
                <h2 id="userName">Loading...</h2>
                <p id="userId">ID: ---</p>
                <span class="user-status" id="userStatus">✅ Verified</span>
            </div>
        </div>

        <!-- Balance Card -->
        <div class="card balance-card">
            <div class="balance-header">
                <span class="balance-label">💰 Balance</span>
                <span class="balance-currency">₹</span>
            </div>
            <div class="balance-amount" id="userBalance">0.00</div>
            <div class="balance-actions">
                <button class="action-btn small primary" onclick="requestData('deposit')">💳 Deposit</button>
                <button class="action-btn small secondary" onclick="requestData('withdraw')">💸 Withdraw</button>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-content">
                    <span class="stat-label">Total Referrals</span>
                    <span class="stat-value" id="refCount">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-content">
                    <span class="stat-label">Verified Refers</span>
                    <span class="stat-value" id="verifiedRef">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💎</div>
                <div class="stat-content">
                    <span class="stat-label">Total Withdraw</span>
                    <span class="stat-value" id="totalWithdraw">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-content">
                    <span class="stat-label">Rank</span>
                    <span class="stat-value" id="userRank">#---</span>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="card">
            <h3>⚡ Quick Actions</h3>
            <div class="quick-actions">
                <button class="action-btn primary" onclick="requestData('buy_channel')">
                    👤 Buy Channel
                </button>
                <button class="action-btn secondary" onclick="requestData('orders')">
                    📜 My Orders
                </button>
                <button class="action-btn success" onclick="requestData('recharge')">
                    📳 Recharge
                </button>
            </div>
        </div>

        <!-- Channel Purchases -->
        <div class="card">
            <h3>📢 My Purchased Channels</h3>
            <div id="purchasedChannels">
                <div class="empty-state">No channels purchased yet</div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="card">
            <h3>📈 Recent Activity</h3>
            <div id="activityList">
                <div class="activity-item">
                    <span class="activity-text">Loading activity...</span>
                </div>
            </div>
        </div>

        <!-- Admin Panel (Hidden for non-admins) -->
        <div class="card admin-panel" id="adminPanel" style="display:none;">
            <h3>🛡️ Admin Panel</h3>
            <div class="admin-actions">
                <button class="action-btn admin" onclick="requestData('admin_stats')">📊 Stats</button>
                <button class="action-btn admin" onclick="requestData('broadcast')">📢 Broadcast</button>
                <button class="action-btn admin" onclick="requestData('channels')">📡 Channels</button>
                <button class="action-btn admin" onclick="requestData('admins')">👮 Admins</button>
                <button class="action-btn admin" onclick="requestData('top_balance')">🏆 Top Balance</button>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
