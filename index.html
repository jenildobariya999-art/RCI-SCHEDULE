<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>CA Study Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

/* NAV */
.nav{position:sticky;top:0;z-index:80;background:rgba(10,10,10,.95);backdrop-filter:blur(10px);border-bottom:1px solid #1e1e1e;padding:0 1rem;height:56px;display:flex;align-items:center;gap:10px}
.nav-logo{font-size:17px;font-weight:900;letter-spacing:-.04em;margin-right:auto}
.nav-logo span{color:#f59e0b}
.nav-link{font-size:13px;font-weight:600;color:#666;padding:6px 12px;border-radius:8px;text-decoration:none;transition:.15s;white-space:nowrap}
.nav-link:hover,.nav-link.on{color:#fff;background:#1a1a1a}
.logout-btn{font-size:12px;color:#555;background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;padding:6px;transition:.15s}
.logout-btn:hover{color:#ef4444}
.nav-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#000;flex-shrink:0}

/* MAIN */
.main{max-width:640px;margin:0 auto;padding:1.25rem 1rem 6rem}

/* HERO */
.hero{text-align:center;padding:2rem 0 1.5rem}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:#111;border:1px solid #222;border-radius:20px;padding:4px 14px;font-size:11px;font-weight:600;color:#666;letter-spacing:.07em;margin-bottom:1rem}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:blink 2s infinite}
@keyframes blink{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.hero h1{font-size:clamp(24px,7vw,42px);font-weight:900;letter-spacing:-.04em;line-height:1.05;margin-bottom:.5rem}
.hero h1 span{color:#f59e0b}
.hero p{font-size:14px;color:#555}

/* NOTIF BAR */
.notif-bar{display:flex;align-items:center;gap:10px;background:#111;border:1px solid #222;border-radius:12px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:13px;color:#666}
.notif-bar.ok{border-color:rgba(34,197,94,.3);color:#22c55e}
.notif-bar button{margin-left:auto;background:#f59e0b;color:#000;border:none;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.notif-bar.ok button{background:rgba(34,197,94,.15);color:#22c55e}

/* TABS */
.tabs{display:flex;gap:7px;margin-bottom:1.25rem;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;background:#111;border:1.5px solid #222;color:#666;padding:7px 16px;border-radius:30px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:.18s;white-space:nowrap}
.tab:hover{border-color:#333;color:#ccc}
.tab.on{background:#f59e0b;border-color:#f59e0b;color:#000}

/* POST CARD */
.post{background:#111;border:1px solid #1e1e1e;border-radius:16px;padding:1.1rem 1.1rem 1.1rem 1.4rem;margin-bottom:.75rem;position:relative;overflow:hidden;animation:slideUp .25s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.post::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3.5px}
.post.meet::before{background:#3b82f6}
.post.urgent::before{background:#ef4444}
.post.notice::before{background:#a78bfa}

.post-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:.6rem}
.post-type-tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.05em}
.meet .post-type-tag{background:rgba(59,130,246,.15);color:#60a5fa}
.urgent .post-type-tag{background:rgba(239,68,68,.15);color:#fca5a5}
.notice .post-type-tag{background:rgba(167,139,250,.15);color:#c4b5fd}
.post-age{font-size:11px;color:#444;white-space:nowrap}
.post-title{font-size:16px;font-weight:800;line-height:1.3;margin-bottom:.5rem;letter-spacing:-.02em}
.post-chips{display:flex;flex-wrap:wrap;gap:7px;margin:.5rem 0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#888;background:#1a1a1a;border:1px solid #252525;padding:4px 10px;border-radius:20px}
.post-body{font-size:13px;color:#666;line-height:1.65;margin-top:.4rem}
.post-footer{display:flex;align-items:center;justify-content:space-between;margin-top:.8rem;padding-top:.7rem;border-top:1px solid #1a1a1a}
.post-from{font-size:11px;color:#444;font-family:monospace}
.del-btn{font-size:11px;color:#444;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;font-family:'Inter',sans-serif;display:none;transition:.15s}
.del-btn:hover{color:#ef4444;background:rgba(239,68,68,.08)}
.admin-mode .del-btn{display:block}

/* EMPTY */
.empty{text-align:center;padding:4rem 1rem;color:#444}
.empty .big{font-size:50px;margin-bottom:.75rem}

/* RAISE HAND FAB */
.fab{position:fixed;bottom:1.5rem;right:1.25rem;width:54px;height:54px;border-radius:50%;background:#f59e0b;border:none;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(245,158,11,.45);transition:.18s;z-index:70}
.fab:hover{transform:scale(1.08)}
.fab:active{transform:scale(.96)}

/* OVERLAY + MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:flex-end;justify-content:center;padding:0}
.overlay.on{display:flex}
.modal{background:#111;border:1px solid #222;border-radius:20px 20px 0 0;padding:1.5rem 1.25rem 2rem;width:100%;max-width:500px;animation:slideModal .25s ease}
@keyframes slideModal{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-title{font-size:18px;font-weight:800;margin-bottom:.4rem;letter-spacing:-.03em}
.modal-sub{font-size:13px;color:#555;margin-bottom:1.25rem}
label{display:block;font-size:11px;font-weight:600;color:#555;letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase}
input[type=text],input[type=tel],textarea{width:100%;background:#1a1a1a;border:1.5px solid #2a2a2a;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.1)}
input::placeholder,textarea::placeholder{color:#444}
textarea{resize:none;min-height:80px}
.field-m{margin-bottom:.9rem}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:all .18s}
.btn-y{background:#f59e0b;color:#000;margin-bottom:.5rem}
.btn-y:hover{background:#d97706}
.btn-g{background:#1a1a1a;color:#888;border:1.5px solid #222}
.btn-g:hover{border-color:#333;color:#ccc}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1e1e1e;border:1px solid #2a2a2a;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;z-index:999;pointer-events:none;opacity:0;transition:.25s;white-space:nowrap;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">CA <span>Board</span></div>
  <a href="index.html" class="nav-link on">📋 Board</a>
  <a href="chat.html" class="nav-link">💬 Chat</a>
  <div class="nav-av" id="nav-av">?</div>
  <button class="logout-btn" onclick="doLogout()">✕</button>
</nav>

<div class="main">
  <div class="hero">
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    <h1>Study Group<br/><span>Announcements</span></h1>
    <p>Posts from your admin appear here instantly</p>
  </div>

  <div class="notif-bar" id="nb">
    🔔 Tap to get notified when admin posts
    <button onclick="enableNotif()">Enable</button>
  </div>

  <div class="tabs">
    <button class="tab on" onclick="filter('all',this)">All</button>
    <button class="tab" onclick="filter('meet',this)">📍 Meet Up</button>
    <button class="tab" onclick="filter('urgent',this)">🚨 Urgent</button>
    <button class="tab" onclick="filter('notice',this)">📋 Notice</button>
  </div>

  <div id="posts"></div>
</div>

<button class="fab" id="hand-fab" onclick="openHand()" title="Raise hand">✋</button>

<!-- RAISE HAND MODAL -->
<div class="overlay" id="hand-ov" onclick="closeOv(event,'hand-ov')">
  <div class="modal">
    <div class="modal-title">✋ Raise Hand</div>
    <div class="modal-sub">Send a private message to admin. Only admin will see this.</div>
    <div class="field-m">
      <label>Your Question / Message (optional)</label>
      <textarea id="hand-txt" placeholder="e.g. Can you explain Chapter 5 taxation topic?"></textarea>
    </div>
    <button class="btn btn-y" onclick="submitHand()">Send to Admin</button>
    <button class="btn btn-g" onclick="document.getElementById('hand-ov').classList.remove('on')">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STORAGE (same as register.html) ─────────────────────────────────────
const K={PW:'cb_pw',NAME:'cb_name',USERS:'cb_users',POSTS:'cb_posts',MSGS:'cb_msgs',HANDS:'cb_hands',F2S:'cb_f2s',SESSION:'cb_sess'};
function sg(k,d=[]){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
function getSession(){try{return JSON.parse(sessionStorage.getItem(K.SESSION))||null}catch{return null}}
function clearSession(){sessionStorage.removeItem(K.SESSION)}
function isAdmin(){return getSession()?.role==='admin'}
function isMember(){return getSession()?.role==='member'}
function currentPhone(){return getSession()?.phone||null}
function currentName(){
  if(isAdmin())return localStorage.getItem(K.NAME)||'Admin';
  const u=(sg(K.USERS,[])).find(u=>u.phone===currentPhone());
  return u?.name||'Member';
}
function getUsers(){return sg(K.USERS,[])}
function findUser(p){return getUsers().find(u=>u.phone===p)||null}
function getPosts(){return sg(K.POSTS,[])}
function getHands(){return sg(K.HANDS,[])}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
function fmtDate(d){if(!d)return'';const[y,mo,day]=d.split('-');const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const dt=new Date(y,parseInt(mo)-1,parseInt(day));const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];return`${D[dt.getDay()]}, ${parseInt(day)} ${M[parseInt(mo)-1]}`}
function fmtTime(t){if(!t)return'';const[h,m]=t.split(':');const hh=parseInt(h);return`${hh%12||12}:${m} ${hh>=12?'PM':'AM'}`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ─── INIT ─────────────────────────────────────────────────────────────────
let curFilter='all';
window.onload=()=>{
  if(!isAdmin()&&!isMember()){location.href='register.html';return}
  if(!isAdmin()){
    const u=findUser(currentPhone());
    if(!u||u.blocked){clearSession();location.href='register.html';return}
    if(!u.approved){location.href='pending.html';return}
  }
  const name=currentName();
  document.getElementById('nav-av').textContent=name[0].toUpperCase();
  if(isAdmin())document.body.classList.add('admin-mode');
  if(isAdmin())document.getElementById('hand-fab').style.display='none';
  if(Notification.permission==='granted'){const nb=document.getElementById('nb');nb.className='notif-bar ok';nb.innerHTML='<span style="font-size:14px">🔔</span> Notifications enabled ✓<button style="cursor:default">On</button>'}
  renderPosts();
  setInterval(renderPosts,8000);
};

// ─── RENDER ───────────────────────────────────────────────────────────────
function filter(f,el){
  curFilter=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');renderPosts();
}
function renderPosts(){
  let posts=getPosts().slice().reverse();
  if(curFilter!=='all')posts=posts.filter(p=>p.type===curFilter);
  const c=document.getElementById('posts');
  if(!posts.length){c.innerHTML=`<div class="empty"><div class="big">📭</div><p>No announcements yet</p></div>`;return}
  const tags={meet:'📍 MEET UP',urgent:'🚨 URGENT',notice:'📋 NOTICE'};
  c.innerHTML=posts.map(p=>`
    <div class="post ${p.type}">
      <div class="post-top">
        <span class="post-type-tag">${tags[p.type]||p.type.toUpperCase()}</span>
        <span class="post-age">${timeAgo(p.ts)}</span>
      </div>
      <div class="post-title">${esc(p.title)}</div>
      ${(p.date||p.time||p.place)?`<div class="post-chips">
        ${p.date?`<span class="chip">📅 ${fmtDate(p.date)}</span>`:''}
        ${p.time?`<span class="chip">🕐 ${fmtTime(p.time)}</span>`:''}
        ${p.place?`<span class="chip">📍 ${esc(p.place)}</span>`:''}
      </div>`:''}
      ${p.body?`<div class="post-body">${esc(p.body)}</div>`:''}
      <div class="post-footer">
        <span class="post-from">— ${esc(p.from)}</span>
        <button class="del-btn" onclick="delPost(${p.id})">🗑 Delete</button>
      </div>
    </div>`).join('');
}
function delPost(id){if(!confirm('Delete?'))return;ss(K.POSTS,getPosts().filter(p=>p.id!==id));renderPosts();toast('🗑 Deleted')}

// ─── NOTIF ────────────────────────────────────────────────────────────────
async function enableNotif(){
  const p=await Notification.requestPermission();
  if(p==='granted'){
    const nb=document.getElementById('nb');nb.className='notif-bar ok';nb.innerHTML='<span>🔔</span> Notifications enabled ✓<button style="cursor:default">On</button>';
    new Notification('CA Board',{body:'You will now get notified for new announcements!'});
    toast('🔔 Notifications ON!');
  }else toast('❌ Denied — allow in browser settings')
}

// ─── RAISE HAND ───────────────────────────────────────────────────────────
function openHand(){document.getElementById('hand-txt').value='';document.getElementById('hand-ov').classList.add('on')}
function submitHand(){
  const note=document.getElementById('hand-txt').value.trim();
  const phone=currentPhone(),name=currentName();
  const hands=getHands();
  if(hands.find(h=>h.phone===phone&&!h.resolved)){toast('⚠️ You already have a pending request');document.getElementById('hand-ov').classList.remove('on');return}
  hands.push({id:Date.now(),phone,name,note,resolved:false,ts:Date.now()});
  ss(K.HANDS,hands);
  document.getElementById('hand-ov').classList.remove('on');
  toast('✋ Sent to admin!');
}
function closeOv(e,id){if(e.target===document.getElementById(id))document.getElementById(id).classList.remove('on')}
function doLogout(){clearSession();location.href='register.html'}

// ─── TOAST ────────────────────────────────────────────────────────────────
let _tt;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),2800)}
</script>
</body>
</html>
