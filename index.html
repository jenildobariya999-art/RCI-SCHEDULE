<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MeetBoard – CA Friends Hub</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="landing-page">

  <div class="bg-grid"></div>
  <div class="floating-orb orb1"></div>
  <div class="floating-orb orb2"></div>

  <div class="landing-container">
    <div class="brand">
      <div class="brand-icon">📋</div>
      <h1 class="brand-name">MeetBoard</h1>
      <p class="brand-tagline">CA Friends Notice Board</p>
    </div>

    <div class="auth-cards">
      <!-- Login Card -->
      <div class="auth-card" id="loginCard">
        <h2>Welcome Back</h2>
        <p class="card-sub">Login to your account</p>

        <div class="form-group">
          <label>Mobile Number</label>
          <div class="input-with-prefix">
            <span>+91</span>
            <input type="tel" id="loginPhone" placeholder="9876543210" maxlength="10"/>
          </div>
        </div>

        <button class="btn-primary" onclick="sendLoginOTP()">Send OTP</button>

        <div class="otp-section hidden" id="loginOtpSection">
          <div class="form-group">
            <label>Enter OTP</label>
            <div class="otp-inputs">
              <input type="text" class="otp-box" maxlength="1" oninput="otpNav(this,1,'login')"/>
              <input type="text" class="otp-box" maxlength="1" oninput="otpNav(this,2,'login')"/>
              <input type="text" class="otp-box" maxlength="1" oninput="otpNav(this,3,'login')"/>
              <input type="text" class="otp-box" maxlength="1" oninput="otpNav(this,4,'login')"/>
            </div>
          </div>
          <button class="btn-primary" onclick="verifyLoginOTP()">Verify & Login</button>
        </div>

        <p class="switch-link">New here? <a href="#" onclick="toggleCard('register')">Register</a></p>
      </div>

      <!-- Register Card -->
      <div class="auth-card hidden" id="registerCard">
        <h2>Join MeetBoard</h2>
        <p class="card-sub">Create your account</p>

        <div class="form-group">
          <label>Your Name</label>
          <input type="text" id="regName" placeholder="Arjun Sharma"/>
        </div>
        <div class="form-group">
          <label>Mobile Number</label>
          <div class="input-with-prefix">
            <span>+91</span>
            <input type="tel" id="regPhone" placeholder="9876543210" maxlength="10"/>
          </div>
        </div>

        <button class="btn-primary" onclick="sendRegisterOTP()">Send OTP</button>

        <div class="otp-section hidden" id="regOtpSection">
          <div class="form-group">
            <label>Enter OTP</label>
            <div class="otp-inputs">
              <input type="text" class="otp-box" maxlength="1" oninput="otpNav(this,1,'reg')"/>
              <input type="text" class="otp-box" maxlength="1" oninput="otpNav(this,2,'reg')"/>
              <input type="text" class="otp-box" maxlength="1" oninput="otpNav(this,3,'reg')"/>
              <input type="text" class="otp-box" maxlength="1" oninput="otpNav(this,4,'reg')"/>
            </div>
          </div>
          <p class="approval-note">⚠️ Account needs Admin approval before login</p>
          <button class="btn-primary" onclick="verifyRegisterOTP()">Verify & Register</button>
        </div>

        <p class="switch-link">Already registered? <a href="#" onclick="toggleCard('login')">Login</a></p>
      </div>

      <!-- Admin Login -->
      <div class="auth-card hidden" id="adminCard">
        <h2>🔐 Admin Access</h2>
        <p class="card-sub">Restricted area</p>
        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPass" placeholder="Enter secret password"/>
        </div>
        <button class="btn-primary" onclick="adminLogin()">Enter Admin Panel</button>
        <p class="switch-link"><a href="#" onclick="toggleCard('login')">← Back</a></p>
      </div>
    </div>

    <p class="admin-link"><a href="#" onclick="toggleCard('admin')">Admin Login →</a></p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
