<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play &amp; Win</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E14;
    --surface:#141922;
    --surface-2:#1C2330;
    --line:#242C3A;
    --gold:#F4B740;
    --gold-2:#FFD87A;
    --teal:#3ED9B3;
    --text:#F3F5F7;
    --muted:#8A93A6;
    --danger:#FF6B6B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #1A2233 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    min-height:100vh;
    padding:14px 14px 28px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .num{font-family:'Sora',system-ui,sans-serif;}

  /* header */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .chip{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:9px 14px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
  }
  .chip b{
    color:var(--text);
    font-family:'Sora',sans-serif;
    font-weight:700;
    font-size:15px;
  }
  .chip.balance b{color:var(--teal);}

  /* hero */
  .hero{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px 16px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    position:relative;
    overflow:hidden;
    min-height:360px;
  }
  .hero h1{
    font-family:'Sora',sans-serif;
    font-size:19px;
    font-weight:700;
    margin:0;
    text-align:center;
    letter-spacing:-0.01em;
  }
  .hero p.sub{
    margin:-10px 0 0;
    color:var(--muted);
    font-size:13px;
    text-align:center;
  }

  /* wheel */
  .wheel-wrap{position:relative;width:250px;height:250px;margin:6px auto 2px;}
  .wheel-pointer{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;
    border-top:20px solid var(--gold-2);z-index:3;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .wheel{
    width:100%;height:100%;border-radius:50%;
    border:6px solid var(--surface-2);
    position:relative;
    transition:transform 3.6s cubic-bezier(.17,.9,.15,1);
    box-shadow:0 0 0 2px var(--line), inset 0 0 30px rgba(0,0,0,.35);
  }
  .wheel-hub{
    position:absolute;top:50%;left:50%;width:44px;height:44px;
    background:var(--gold);border-radius:50%;transform:translate(-50%,-50%);
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2;
  }
  .wheel-label{
    position:absolute;left:50%;top:50%;width:0;height:0;
  }
  .wheel-label span{
    position:absolute;left:0;top:0;
    transform-origin:0 0;
    font-family:'Sora',sans-serif;font-weight:700;font-size:13px;
    white-space:nowrap;
  }

  /* scratch */
  .scratch-wrap{
    width:230px;height:150px;border-radius:16px;position:relative;
    background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    margin:6px auto 2px;
  }
  .scratch-reward{
    font-family:'Sora',sans-serif;font-weight:800;font-size:28px;color:var(--gold);
  }
  .scratch-canvas{position:absolute;inset:0;border-radius:16px;cursor:grab;touch-action:none;}
  .scratch-hint{
    position:absolute;bottom:-26px;left:0;right:0;text-align:center;
    color:var(--muted);font-size:12px;
  }

  /* dice */
  .dice-wrap{margin:10px auto 2px;perspective:600px;}
  .die{
    width:88px;height:88px;background:linear-gradient(145deg,#fff,#dcdfe5);
    border-radius:18px;display:flex;align-items:center;justify-content:center;
    font-size:40px;color:#141922;box-shadow:0 10px 24px rgba(0,0,0,.4);
    transition:transform .9s cubic-bezier(.2,.9,.2,1);
  }
  .die.rolling{animation:roll .9s linear;}
  @keyframes roll{
    0%{transform:rotateX(0) rotateY(0);}
    100%{transform:rotateX(720deg) rotateY(360deg);}
  }

  /* tap / coin */
  .coin-wrap{margin:10px auto 2px;perspective:700px;}
  .coin{
    width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-2), var(--gold) 60%, #a97a12 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:#3a2a00;
    box-shadow:0 10px 26px rgba(0,0,0,.4);
    transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.2,.9,.2,1);
  }
  .coin.flipping{animation:flip 1.1s linear;}
  @keyframes flip{
    0%{transform:rotateY(0);}
    100%{transform:rotateY(1440deg);}
  }

  /* play button */
  .play-btn{
    width:100%;max-width:280px;
    border:none;border-radius:16px;
    padding:15px 20px;
    font-family:'Sora',sans-serif;font-weight:700;font-size:16px;
    background:linear-gradient(180deg,var(--gold-2),var(--gold));
    color:#241a00;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(244,183,64,.28);
    transition:transform .15s ease, opacity .2s ease;
  }
  .play-btn:active{transform:scale(.97);}
  .play-btn:disabled{
    background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:not-allowed;
  }

  .plays-left{color:var(--muted);font-size:12.5px;text-align:center;}

  /* off state */
  .off-state{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    color:var(--muted);text-align:center;padding:40px 10px;
  }
  .off-state .icon{font-size:34px;}

  /* result overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(6,8,12,.72);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    z-index:10;padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .result-card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:20px;padding:28px 24px;text-align:center;
    max-width:280px;width:100%;
    transform:translateY(10px) scale(.96);transition:transform .25s ease;
  }
  .overlay.show .result-card{transform:translateY(0) scale(1);}
  .result-amount{
    font-family:'Sora',sans-serif;font-weight:800;font-size:38px;
    color:var(--gold);margin:6px 0 2px;
  }
  .result-caption{color:var(--muted);font-size:13.5px;margin-bottom:18px;}
  .result-close{
    border:none;border-radius:12px;padding:11px 18px;width:100%;
    background:var(--surface-2);color:var(--text);font-weight:600;
    font-family:'Manrope',sans-serif;font-size:14px;cursor:pointer;
  }

  .toast{
    position:fixed;left:16px;right:16px;bottom:20px;
    background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);padding:12px 16px;border-radius:14px;
    font-size:13.5px;text-align:center;
    opacity:0;transform:translateY(8px);transition:all .25s ease;
    pointer-events:none;z-index:20;
  }
  .toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

  <div class="topbar">
    <div class="chip balance">Balance&nbsp;<b id="balanceVal">₹0</b></div>
    <div class="chip">Plays left&nbsp;<b id="playsVal">–</b></div>
  </div>

  <div class="hero" id="hero">
    <div class="off-state" id="loadingState">
      <div class="icon">🎮</div>
      <div>Loading the game…</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="result-card">
      <div id="resultEmoji" style="font-size:30px;">🎉</div>
      <div class="result-amount" id="resultAmount">₹0</div>
      <div class="result-caption" id="resultCaption">Added to your balance</div>
      <button class="result-close" id="resultClose">Nice</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ---- config -------------------------------------------------------
  const BOTID = "52989644";
  const PROXY_URL = "/api/proxy"; // adjust if your proxy.js lives elsewhere

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = tg ? tg.initData : "";

  const hero = document.getElementById('hero');
  const balanceVal = document.getElementById('balanceVal');
  const playsVal = document.getElementById('playsVal');
  const overlay = document.getElementById('overlay');
  const resultAmount = document.getElementById('resultAmount');
  const resultCaption = document.getElementById('resultCaption');
  const resultEmoji = document.getElementById('resultEmoji');
  const toastEl = document.getElementById('toast');

  let state = { active_game: 'off', prizes: [], daily_limit: 1, plays_left: 0, balance: 0 };
  let busy = false;

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 2600);
  }

  function money(n){
    const v = Number(n) || 0;
    return '₹' + (Number.isInteger(v) ? v : v.toFixed(2));
  }

  async function callApi(action, extra){
    const body = Object.assign({ botid: BOTID, action, init_data: initData }, extra || {});
    const res = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return res.json();
  }

  function updateHeader(){
    balanceVal.textContent = money(state.balance);
    playsVal.textContent = `${state.plays_left}/${state.daily_limit}`;
  }

  function showResult(amount, gameLabel){
    resultAmount.textContent = money(amount);
    if (amount > 0){
      resultEmoji.textContent = '🎉';
      resultCaption.textContent = 'Added to your balance';
    } else {
      resultEmoji.textContent = '🙈';
      resultCaption.textContent = 'No prize this time — try again tomorrow';
    }
    overlay.classList.add('show');
  }
  document.getElementById('resultClose').onclick = () => overlay.classList.remove('show');

  // ---------------- render per game type ----------------

  function renderOff(){
    hero.innerHTML = `
      <div class="off-state">
        <div class="icon">🛠️</div>
        <div>The game isn't turned on right now.<br>Check back a little later!</div>
      </div>`;
  }

  function renderSpin(){
    const prizes = state.prizes;
    const n = prizes.length;
    const colors = ['#F4B740','#1C2330'];
    const slice = 360 / n;
    let gradientParts = [];
    for (let i=0;i<n;i++){
      gradientParts.push(`${colors[i%2]} ${i*slice}deg ${(i+1)*slice}deg`);
    }
    let labels = '';
    for (let i=0;i<n;i++){
      const mid = i*slice + slice/2;
      const color = i%2===0 ? '#241a00' : '#F4B740';
      labels += `<div class="wheel-label">
        <span style="color:${color};transform:rotate(${mid}deg) translate(0,-95px) rotate(${-mid}deg) translate(-50%,-50%)">₹${prizes[i]}</span>
      </div>`;
    }
    hero.innerHTML = `
      <h1>Spin &amp; Win</h1>
      <p class="sub">One spin could add up to ${money(Math.max(...prizes))} to your balance.</p>
      <div class="wheel-wrap">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="wheel" style="background:conic-gradient(${gradientParts.join(',')})">
          ${labels}
          <div class="wheel-hub">🎯</div>
        </div>
      </div>
      <button class="play-btn" id="playBtn">Spin the wheel</button>
      <div class="plays-left" id="playsLeftLine"></div>
    `;
    updatePlaysLine();
    document.getElementById('playBtn').onclick = playSpin;
  }

  async function playSpin(){
    if (busy) return;
    if (state.plays_left <= 0){ toast("No plays left today"); return; }
    busy = true;
    const btn = document.getElementById('playBtn');
    btn.disabled = true;
    const r = await callApi('game_play');
    if (!r.ok){ toast(r.error || 'Something went wrong'); btn.disabled=false; busy=false; return; }

    const n = state.prizes.length;
    const slice = 360/n;
    const idx = r.prize_index;
    const targetCenter = idx*slice + slice/2;
    const spins = 5*360;
    const finalAngle = spins + (360 - targetCenter);

    const wheel = document.getElementById('wheel');
    wheel.style.transform = `rotate(${finalAngle}deg)`;

    setTimeout(()=>{
      state.balance = r.balance;
      state.plays_left = r.plays_left;
      updateHeader();
      updatePlaysLine();
      showResult(r.amount, 'spin');
      btn.disabled = state.plays_left<=0;
      busy = false;
    }, 3700);
  }

  function renderScratch(){
    hero.innerHTML = `
      <h1>Scratch Card</h1>
      <p class="sub">Tap "Get a card" then scratch it off to reveal your prize.</p>
      <div class="scratch-wrap" id="scratchWrap">
        <div class="scratch-reward" id="scratchReward">₹0</div>
        <canvas class="scratch-canvas" id="scratchCanvas" width="230" height="150"></canvas>
        <div class="scratch-hint" id="scratchHint" style="display:none;">Scratch anywhere on the card</div>
      </div>
      <button class="play-btn" id="playBtn">Get a card</button>
      <div class="plays-left" id="playsLeftLine"></div>
    `;
    updatePlaysLine();
    document.getElementById('playBtn').onclick = playScratch;
  }

  async function playScratch(){
    if (busy) return;
    if (state.plays_left <= 0){ toast("No plays left today"); return; }
    busy = true;
    const btn = document.getElementById('playBtn');
    btn.disabled = true;
    const r = await callApi('game_play');
    if (!r.ok){ toast(r.error || 'Something went wrong'); btn.disabled=false; busy=false; return; }

    document.getElementById('scratchReward').textContent = money(r.amount);
    document.getElementById('scratchHint').style.display = 'block';
    btn.style.display = 'none';

    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#B9C1CE';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = 'rgba(0,0,0,.06)';
    for (let i=0;i<300;i++){
      ctx.beginPath();
      ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*2, 0, 7);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'destination-out';

    let drawing = false;
    let scratchedPixels = 0;
    const totalPixels = canvas.width*canvas.height;

    function scratchAt(x,y){
      ctx.beginPath();
      ctx.arc(x,y,16,0,Math.PI*2);
      ctx.fill();
    }
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX-rect.left, y: p.clientY-rect.top };
    }
    function checkDone(){
      scratchedPixels += 1;
      if (scratchedPixels > 14){
        finishScratch();
      }
    }
    function finishScratch(){
      canvas.style.transition = 'opacity .4s ease';
      canvas.style.opacity = '0';
      setTimeout(()=>{
        state.balance = r.balance;
        state.plays_left = r.plays_left;
        updateHeader();
        updatePlaysLine();
        showResult(r.amount, 'scratch');
        busy = false;
      }, 350);
      canvas.removeEventListener('pointerdown', onDown);
      canvas.removeEventListener('pointermove', onMove);
    }
    function onDown(e){ drawing = true; const p = pos(e); scratchAt(p.x,p.y); checkDone(); }
    function onMove(e){ if(!drawing) return; const p = pos(e); scratchAt(p.x,p.y); checkDone(); }
    window.addEventListener('pointerup', ()=>drawing=false);
    canvas.addEventListener('pointerdown', onDown);
    canvas.addEventListener('pointermove', onMove);
  }

  function renderDice(){
    hero.innerHTML = `
      <h1>Daily Dice Roll</h1>
      <p class="sub">Roll the die for a random reward.</p>
      <div class="dice-wrap"><div class="die" id="die">🎲</div></div>
      <button class="play-btn" id="playBtn">Roll the dice</button>
      <div class="plays-left" id="playsLeftLine"></div>
    `;
    updatePlaysLine();
    document.getElementById('playBtn').onclick = playDice;
  }

  async function playDice(){
    if (busy) return;
    if (state.plays_left <= 0){ toast("No plays left today"); return; }
    busy = true;
    const btn = document.getElementById('playBtn');
    btn.disabled = true;
    const r = await callApi('game_play');
    if (!r.ok){ toast(r.error || 'Something went wrong'); btn.disabled=false; busy=false; return; }

    const die = document.getElementById('die');
    const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    die.classList.add('rolling');
    let i = 0;
    const spin = setInterval(()=>{ die.textContent = faces[i%6]; i++; }, 90);

    setTimeout(()=>{
      clearInterval(spin);
      die.classList.remove('rolling');
      die.textContent = faces[Math.floor(Math.random()*6)];
      state.balance = r.balance;
      state.plays_left = r.plays_left;
      updateHeader();
      updatePlaysLine();
      showResult(r.amount, 'dice');
      btn.disabled = state.plays_left<=0;
      busy = false;
    }, 950);
  }

  function renderTap(){
    hero.innerHTML = `
      <h1>Lucky Coin Flip</h1>
      <p class="sub">Flip the coin and see what you land on.</p>
      <div class="coin-wrap"><div class="coin" id="coin">FLIP ME</div></div>
      <button class="play-btn" id="playBtn">Flip the coin</button>
      <div class="plays-left" id="playsLeftLine"></div>
    `;
    updatePlaysLine();
    document.getElementById('playBtn').onclick = playTap;
  }

  async function playTap(){
    if (busy) return;
    if (state.plays_left <= 0){ toast("No plays left today"); return; }
    busy = true;
    const btn = document.getElementById('playBtn');
    btn.disabled = true;
    const r = await callApi('game_play');
    if (!r.ok){ toast(r.error || 'Something went wrong'); btn.disabled=false; busy=false; return; }

    const coin = document.getElementById('coin');
    coin.classList.add('flipping');

    setTimeout(()=>{
      coin.classList.remove('flipping');
      coin.textContent = money(r.amount);
      state.balance = r.balance;
      state.plays_left = r.plays_left;
      updateHeader();
      updatePlaysLine();
      showResult(r.amount, 'tap');
      btn.disabled = state.plays_left<=0;
      busy = false;
    }, 1150);
  }

  function updatePlaysLine(){
    const line = document.getElementById('playsLeftLine');
    if (!line) return;
    line.textContent = state.plays_left > 0
      ? `${state.plays_left} of ${state.daily_limit} plays left today`
      : 'No plays left — come back tomorrow';
    const btn = document.getElementById('playBtn');
    if (btn) btn.disabled = state.plays_left <= 0;
  }

  function render(){
    updateHeader();
    if (state.active_game === 'spin') renderSpin();
    else if (state.active_game === 'scratch') renderScratch();
    else if (state.active_game === 'dice') renderDice();
    else if (state.active_game === 'tap') renderTap();
    else renderOff();
  }

  async function init(){
    try{
      const r = await callApi('game_config');
      if (!r.ok){ toast(r.error || 'Could not load the game'); renderOff(); return; }
      state = r;
      render();
    } catch(e){
      toast('Connection error — pull to refresh and try again');
      renderOff();
    }
  }

  init();
</script>
</body>
</html>
