<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Join — CA Study Board</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080e;
  --card:#0e0e1a;
  --card2:#13131f;
  --card3:#191926;
  --line:#ffffff0d;
  --line2:#ffffff16;
  --line3:#ffffff22;
  --t1:#f4f4ff;
  --t2:#a0a0c8;
  --t3:#58587a;
  --t4:#30304a;
  --amber:#f59e0b;
  --amber2:#fbbf24;
  --indigo:#6366f1;
  --violet:#8b5cf6;
  --green:#22c55e;
  --red:#f87171;
  --font:'Plus Jakarta Sans',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html,body{min-height:100vh;font-family:var(--font);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--t1)}
body{
  display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:
    radial-gradient(ellipse 60% 50% at 20% 100%,rgba(99,102,241,.08) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 0%,rgba(245,158,11,.07) 0%,transparent 55%),
    var(--bg);
}

/* ── CARD ── */
.card{
  width:100%;max-width:410px;
  background:var(--card);
  border:1px solid var(--line2);
  border-radius:24px;
  padding:2.25rem 2rem;
  box-shadow:0 40px 80px rgba(0,0,0,.5);
  animation:rise .4s cubic-bezier(.22,1,.36,1);
}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ── LOGO ── */
.logo{text-align:center;margin-bottom:2.25rem}
.logo-mark{
  width:60px;height:60px;border-radius:18px;
  background:linear-gradient(135deg,var(--amber),var(--amber2));
  display:flex;align-items:center;justify-content:center;
  font-size:26px;margin:0 auto .9rem;
  box-shadow:0 8px 32px rgba(245,158,11,.3);
}
.logo h1{font-size:21px;font-weight:800;letter-spacing:-.04em;color:var(--t1)}
.logo h1 span{color:var(--amber)}
.logo p{font-size:13px;color:var(--t3);margin-top:.3rem;font-weight:500}

/* ── STEPS ── */
.step{display:none}.step.on{display:block}

/* ── LABEL ── */
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px;font-family:var(--mono)}

/* ── FIELD ── */
.field{margin-bottom:1.1rem}

/* ── INPUT ── */
input{
  width:100%;background:var(--card2);
  border:1.5px solid var(--line2);
  color:var(--t1);border-radius:12px;
  padding:13px 16px;
  font-family:var(--font);font-size:14px;font-weight:500;
  outline:none;transition:all .2s;
}
input:focus{border-color:var(--amber);box-shadow:0 0 0 4px rgba(245,158,11,.1);background:var(--card3)}
input::placeholder{color:var(--t4);font-weight:400}

.ph-row{display:flex;gap:8px}
.prefix{
  background:var(--card2);border:1.5px solid var(--line2);
  color:var(--t3);border-radius:12px;padding:13px 14px;
  font-family:var(--mono);font-size:13px;white-space:nowrap;
  display:flex;align-items:center;gap:5px;font-weight:500;
}

/* ── BTN ── */
.btn{
  width:100%;border:none;border-radius:12px;padding:14px;
  font-family:var(--font);font-size:14px;font-weight:700;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--amber),var(--amber2));
  color:#000;
  box-shadow:0 4px 24px rgba(245,158,11,.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(245,158,11,.4)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.45;pointer-events:none}
.btn-ghost{
  background:transparent;color:var(--t2);
  border:1.5px solid var(--line2);margin-top:.6rem;
}
.btn-ghost:hover{border-color:var(--line3);color:var(--t1)}

/* ── OTP ── */
.otp-row{display:flex;gap:8px}
.otp-row input{
  flex:1;text-align:center;
  font-size:20px;font-weight:700;
  font-family:var(--mono);padding:13px 2px;
}
.otp-row input.filled{border-color:var(--amber);background:var(--card3)}

.resend-row{display:flex;justify-content:flex-end;margin-top:.5rem}
.resend-btn{
  background:none;border:none;font-size:12px;font-weight:600;
  color:var(--t3);cursor:pointer;font-family:var(--font);transition:.15s;
}
.resend-btn:not(:disabled):hover{color:var(--amber)}
.resend-btn:disabled{opacity:.35}

/* ── STATUS PILL ── */
.status-pill{
  display:flex;align-items:center;gap:10px;
  background:var(--card2);border:1px solid var(--line2);
  border-radius:10px;padding:.75rem 1rem;margin-bottom:1.25rem;
  font-size:13px;color:var(--t2);font-weight:500;
}
.status-pill .ph-num{font-family:var(--mono);font-weight:600;color:var(--t1);font-size:13px}

/* ── ERROR ── */
.err{
  font-size:12px;font-weight:600;color:var(--red);
  margin-top:7px;display:none;
  padding:8px 12px;background:rgba(248,113,113,.07);
  border-radius:8px;border:1px solid rgba(248,113,113,.15);
}

/* ── OR ── */
.or{text-align:center;color:var(--t4);font-size:12px;margin:.9rem 0;position:relative}
.or::before,.or::after{content:'';position:absolute;top:50%;width:44%;height:1px;background:var(--line2)}
.or::before{left:0}.or::after{right:0}

/* ── ADMIN LINK ── */
a.adm-link{
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:1.5px solid var(--line2);border-radius:12px;padding:12px;
  font-size:13px;font-weight:600;color:var(--t3);text-decoration:none;transition:.2s;
}
a.adm-link:hover{border-color:rgba(245,158,11,.3);color:var(--amber)}

/* ── PENDING ── */
.pending-wrap{text-align:center;padding:.5rem 0}
.pending-icon{
  width:68px;height:68px;border-radius:50%;
  background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(251,191,36,.1));
  border:2px solid rgba(245,158,11,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;margin:0 auto 1.25rem;
}
.pending-wrap h2{font-size:20px;font-weight:800;color:var(--t1);margin-bottom:.4rem;letter-spacing:-.03em}
.pending-wrap p{font-size:13px;color:var(--t3);line-height:1.65;font-weight:500}
.info-card{
  background:var(--card2);border:1px solid var(--line2);
  border-radius:12px;padding:1rem 1.25rem;
  margin:1.25rem 0;text-align:left;
  display:flex;flex-direction:column;gap:.5rem;
}
.info-row{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:var(--t2)}
.info-row strong{color:var(--t1);font-family:var(--mono);font-size:13px}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);
  background:var(--card3);border:1px solid var(--line3);color:var(--t1);
  padding:11px 22px;border-radius:30px;font-size:13px;font-weight:600;
  z-index:999;pointer-events:none;opacity:0;transition:opacity .25s;
  white-space:nowrap;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.4);
}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">📚</div>
    <h1>CA <span>Study Board</span></h1>
    <p>Register to join your study group</p>
  </div>

  <!-- S1: Name + Phone -->
  <div class="step on" id="s1">
    <div class="field">
      <label class="lbl">Your Name</label>
      <input id="r-name" type="text" placeholder="e.g. Ravi Patel" autocomplete="name"/>
    </div>
    <div class="field">
      <label class="lbl">Mobile Number</label>
      <div class="ph-row">
        <span class="prefix">🇮🇳 +91</span>
        <input id="r-phone" type="tel" placeholder="9876543210" maxlength="10" inputmode="numeric"/>
      </div>
      <div class="err" id="e1">Enter a valid name and 10-digit number</div>
    </div>
    <button class="btn btn-primary" id="send-btn" onclick="doStep1()">Send OTP →</button>
    <div class="or">or</div>
    <a href="admin.html" class="adm-link">🔐 Admin Login</a>
  </div>

  <!-- S2: OTP -->
  <div class="step" id="s2">
    <div class="status-pill">
      <span>📱 OTP sent to</span>
      <span class="ph-num" id="otp-dest">—</span>
    </div>
    <div id="otp-fallback" style="display:none;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem;font-size:13px;color:var(--amber);font-weight:500">
      ⚠️ SMS failed. Your OTP: <span id="fallback-code" style="font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:.1em;color:var(--t1)"></span>
    </div>
    <div class="field">
      <label class="lbl">6-Digit OTP</label>
      <div class="otp-row">
        <input type="text" maxlength="1" inputmode="numeric" class="oc" oninput="onOtp(this,0)" onkeydown="onOtpKey(event,0)"/>
        <input type="text" maxlength="1" inputmode="numeric" class="oc" oninput="onOtp(this,1)" onkeydown="onOtpKey(event,1)"/>
        <input type="text" maxlength="1" inputmode="numeric" class="oc" oninput="onOtp(this,2)" onkeydown="onOtpKey(event,2)"/>
        <input type="text" maxlength="1" inputmode="numeric" class="oc" oninput="onOtp(this,3)" onkeydown="onOtpKey(event,3)"/>
        <input type="text" maxlength="1" inputmode="numeric" class="oc" oninput="onOtp(this,4)" onkeydown="onOtpKey(event,4)"/>
        <input type="text" maxlength="1" inputmode="numeric" class="oc" oninput="onOtp(this,5)" onkeydown="onOtpKey(event,5)"/>
      </div>
      <div class="resend-row">
        <button class="resend-btn" id="resend-btn" disabled onclick="doResend()">Resend (<span id="rtimer">30</span>s)</button>
      </div>
      <div class="err" id="e2">Wrong OTP — please try again</div>
    </div>
    <button class="btn btn-primary" onclick="doStep2()">Verify & Continue ✓</button>
    <button class="btn btn-ghost" onclick="goStep(1)">← Change number</button>
  </div>

  <!-- S3: Pending -->
  <div class="step" id="s3">
    <div class="pending-wrap">
      <div class="pending-icon">⏳</div>
      <h2>Registered!</h2>
      <p>Your request is sent to admin.<br/>You'll get access once approved.</p>
      <div class="info-card">
        <div class="info-row">👤 <strong id="p-name">—</strong></div>
        <div class="info-row">📱 <strong id="p-phone">—</strong></div>
      </div>
      <button class="btn btn-primary" onclick="checkApproval()">🔄 Check Approval</button>
      <button class="btn btn-ghost" onclick="doLogout()">Logout</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
const F2S='FGxDoXM9aHdhl8VqenctT4b7gYwfBCIrNA6mvK5j3OiJsLk01SJUcLGNAiWXqSmjyMxEV7KzZFhp5RYB';
const K={USERS:'cab_users'};
const OTPS={};
let rPhone='',rName='',rtInt;

function sg(k,d){try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d}catch{return d}}
function ss(k,v){localStorage.setItem(k,JSON.stringify(v))}
function getS(){try{return JSON.parse(sessionStorage.getItem('cab_s'))||null}catch{return null}}
function setS(d){sessionStorage.setItem('cab_s',JSON.stringify(d))}
function clearS(){sessionStorage.removeItem('cab_s')}
function getUsers(){return sg(K.USERS,[])}
function findUser(p){return getUsers().find(u=>u.phone===p)||null}

function toast(m,dur=2800){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),dur)}
function goStep(n){document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('on',i===n-1))}

window.addEventListener('load',()=>{
  const s=getS();
  if(s?.role==='admin'){location.href='admin.html';return}
  if(s?.role==='member'){
    const u=findUser(s.phone);
    if(u?.approved){location.href='index.html';return}
    if(u){rPhone=s.phone;rName=u.name;document.getElementById('p-name').textContent=u.name;document.getElementById('p-phone').textContent='+91 '+s.phone;goStep(3);return}
  }
});

function genOtp(){return String(Math.floor(100000+Math.random()*900000))}

async function sendSMS(phone){
  const otp=genOtp();
  OTPS[phone]={otp,ts:Date.now()};
  try{
    const r=await fetch(`https://www.fast2sms.com/dev/bulkV2?authorization=${F2S}&variables_values=${otp}&route=otp&numbers=${phone}`,{method:'GET',headers:{'Cache-Control':'no-cache'}});
    const d=await r.json();
    return{ok:d.return===true,otp};
  }catch{return{ok:false,otp}}
}

async function doStep1(){
  const name=document.getElementById('r-name').value.trim();
  const phone=document.getElementById('r-phone').value.trim();
  if(!name||!/^[6-9]\d{9}$/.test(phone)){document.getElementById('e1').style.display='block';return}
  document.getElementById('e1').style.display='none';
  const u=findUser(phone);
  if(u?.blocked){toast('🚫 Number blocked by admin');return}
  rPhone=phone;rName=name;
  const btn=document.getElementById('send-btn');
  btn.disabled=true;btn.textContent='Sending...';
  const res=await sendSMS(phone);
  btn.disabled=false;btn.innerHTML='Send OTP →';
  document.getElementById('otp-dest').textContent='+91 '+phone;
  if(res.ok){
    toast('✅ OTP sent to your mobile!');
    document.getElementById('otp-fallback').style.display='none';
  } else {
    document.getElementById('otp-fallback').style.display='block';
    document.getElementById('fallback-code').textContent=res.otp;
    toast('⚠️ SMS failed — OTP shown on screen',4000);
  }
  goStep(2);startResend();
  setTimeout(()=>document.querySelectorAll('.oc')[0].focus(),80);
}

function startResend(){
  let s=30;const el=document.getElementById('rtimer'),btn=document.getElementById('resend-btn');
  btn.disabled=true;clearInterval(rtInt);
  rtInt=setInterval(()=>{s--;el.textContent=s;if(s<=0){clearInterval(rtInt);btn.disabled=false;btn.textContent='Resend OTP'}},1000);
}
async function doResend(){
  const res=await sendSMS(rPhone);
  if(res.ok)toast('✅ New OTP sent!');
  else{document.getElementById('otp-fallback').style.display='block';document.getElementById('fallback-code').textContent=res.otp;toast('⚠️ SMS failed — shown on screen',4000)}
  startResend();
}

function getOtpVal(){return[...document.querySelectorAll('.oc')].map(i=>i.value).join('')}

function doStep2(){
  const otp=getOtpVal();
  if(otp.length!==6){document.getElementById('e2').style.display='block';return}
  const s=OTPS[rPhone];
  if(!s||Date.now()-s.ts>600000||s.otp!==otp){
    document.getElementById('e2').style.display='block';
    document.querySelectorAll('.oc').forEach(i=>{i.value='';i.style.borderColor='var(--red)';i.classList.remove('filled')});
    setTimeout(()=>document.querySelectorAll('.oc').forEach(i=>i.style.borderColor=''),1600);
    return;
  }
  document.getElementById('e2').style.display='none';
  const existing=findUser(rPhone);
  if(existing?.approved){setS({role:'member',phone:rPhone});location.href='index.html';return}
  if(!existing){const users=getUsers();users.push({phone:rPhone,name:rName,approved:false,blocked:false,joinedAt:Date.now()});ss(K.USERS,users)}
  setS({role:'member',phone:rPhone});
  document.getElementById('p-name').textContent=rName;
  document.getElementById('p-phone').textContent='+91 '+rPhone;
  goStep(3);
}

function checkApproval(){
  const u=findUser(rPhone||getS()?.phone);
  if(!u){toast('Not found, register again');return}
  if(u.approved){setS({role:'member',phone:u.phone});location.href='index.html'}
  else if(u.blocked){clearS();location.href='register.html'}
  else toast('⏳ Not approved yet. Contact admin.',3500)
}
function doLogout(){clearS();location.href='register.html'}
function onOtp(el,i){el.value=el.value.replace(/\D/,'');el.classList.toggle('filled',!!el.value);if(el.value&&i<5)document.querySelectorAll('.oc')[i+1].focus();if(getOtpVal().length===6)setTimeout(doStep2,120)}
function onOtpKey(e,i){if(e.key==='Backspace'&&!e.target.value&&i>0)document.querySelectorAll('.oc')[i-1].focus()}
</script>
</body>
</html>
